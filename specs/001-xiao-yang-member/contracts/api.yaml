# API Contract: 小扬同学

**Version**: 1.0.0 | **Base URL**: `https://api.xiaoyang.macaulive.org/v1`

## Authentication

所有 API 请求在 Header 中携带 JWT Token（除登录接口外）：
```
Authorization: Bearer <jwt_token>
```

角色声明在 JWT payload 中：
```json
{
  "sub": "<member_id>",
  "role": "member|staff|root",
  "exp": 1715678900
}
```

---

## 1. 认证 (Auth)

### POST /auth/login/wechat
微信小程序登录
- Body: `{ "code": "wx_login_code" }`
- Response 200: `{ "token": "jwt...", "member": { ... } }`
- Response 401: `{ "error": "invalid_code" }`

---

## 2. 会员咨询 (Chat)

### POST /chat/message
发送对话消息（流式 SSE 响应）
- Body: `{ "message": "入会需要什么条件？" }`
- Response 200 (SSE): `data: {"type": "chunk", "content": "澳门直播协会..."}\n\n`
- Response 200 (final): `data: {"type": "done", "source": "rag|fallback"}\n\n`

### GET /chat/history
获取对话历史
- Query: `?limit=20&before=<cursor>`
- Response 200: `{ "messages": [{ "role": "user|assistant", "content": "...", "created_at": "..." }], "next_cursor": "..." }`

---

## 3. 入会申请 (Application)

### POST /applications
提交入会申请
- Body:
```json
{
  "name": "张三",
  "phone": "+85366668888",
  "email": "zhang@example.com",
  "address": "澳门...",
  "career_history": "从事直播行业3年...",
  "qualifications": "主播资格证"
}
```
- Response 201: `{ "application_id": "uuid", "status": "待审核" }`
- Response 409: `{ "error": "duplicate_application" }`

### GET /applications/{id}
查询申请状态
- Response 200: `{ "application": { ... }, "status_history": [...] }`

### GET /applications
（staff/board）查询申请列表
- Query: `?status=待审核&page=1&page_size=20`
- Response 200: `{ "items": [...], "total": 10, "page": 1 }`

### POST /applications/{id}/screening
（system）初審结果
- Body: `{ "result": "pass|fail", "reason": "符合入会条件" }`
- Response 200: `{ "status": "初審通过" }`

### POST /applications/{id}/final-review
（root理事）终審结果
- Body: `{ "result": "pass|fail", "comment": "同意入会" }`
- Response 200: `{ "status": "终審通过" }`

### POST /applications/{id}/payment-proof
上传缴费凭证
- Body (multipart): `file: <image>`
- Response 200: `{ "status": "待缴费", "payment_proof_url": "/uploads/payment/xxx.jpg" }`

### POST /applications/{id}/verify-payment
（root理事）确认缴费
- Response 200: `{ "status": "已缴费" }`

---

## 4. 会员管理 (Member)

### GET /members/me
获取当前登录会员信息
- Response 200: `{ "member": { ... } }`

### PATCH /members/me
更新个人资料
- Body: `{ "phone": "+85399998888", "email": "new@example.com" }`
- Response 200: `{ "member": { ... } }`

### GET /members/{id}
（staff/board）查看任意会员详情
- Response 200: `{ "member": { ... } }`

### PATCH /members/{id}
（staff）修改会员资料
- Body: `{ "tier": "高级", "status": "在籍" }`
- Response 200: `{ "member": { ... } }`

### GET /members
（staff）会员列表
- Query: `?tier=普通&status=在籍&page=1&page_size=20`
- Response 200: `{ "items": [...], "total": 500, "page": 1 }`

### GET /members/export
（staff）批量导出 CSV
- Response 200: `text/csv` 文件流

### GET /members/me/tier
查询当前会员等级与年费
- Response 200: `{ "tier": "高级", "annual_fee": 2000 }`

---

## 5. 活动 (Event)

### POST /events
（staff）创建活动
- Body: `{ "title": "...", "description": "...", "event_date": "...", "location": "...", "price_normal": 100, "price_advanced": 80, "max_participants": 50 }`
- Response 201: `{ "id": "uuid" }`

### PATCH /events/{id}
（staff）编辑活动
- Body: `{ "title": "...", "location": "..." }`
- Response 200: `{ "id": "uuid" }`

### DELETE /events/{id}
（staff）取消活动
- Response 200: `{ "status": "已取消" }`


### GET /events
活动列表
- Query: `?status=开放&from=2026-05-01&page=1&page_size=10`
- Response 200: `{ "items": [...], "total": 5 }`

### GET /events/{id}
活动详情
- Response 200: `{ "event": { ... }, "registrations_count": 30 }`

### POST /events/{id}/register
报名活动
- Response 200: `{ "registration_id": "uuid", "status": "已报名" }`
- Response 409: `{ "error": "already_registered" }`
- Response 400: `{ "error": "event_full" }`

### DELETE /events/{id}/register
取消报名
- Response 200: `{ "status": "已取消" }`

---

## 6. 通知 (Notification)

### GET /notifications
我的通知列表
- Query: `?type=缴费&page=1&page_size=10`
- Response 200: `{ "items": [...], "unread_count": 3 }`

### POST /notifications
（staff/system）发送通知
- Body: `{ "member_ids": ["uuid1", "uuid2"], "type": "活动", "title": "...", "content": "..." }`
- Response 201: `{ "notification_count": 2 }`

---

## 7. 数据统计 (Analytics)

### GET /analytics/members
（staff）会员数据概览
- Response 200: `{ "total": 500, "by_tier": { "普通": 300, "高级": 150, "理事": 50 }, "by_status": { "在籍": 480, "停用": 10, "过期": 10 }, "monthly_growth": [...] }`

### GET /analytics/activity
（staff/board）活跃度分析
- Response 200: `{ "monthly_active": 200, "event_participation_rate": 0.4, "dues_renewal_rate": 0.85 }`

---

## 8. 章程规则管理 (ConstitutionRules)

### GET /constitution-rules
（staff/board）查询所有现行章程规则
- Query: `?rule_type=入会条件`
- Response 200: `{ "items": [{ "id": "uuid", "rule_type": "入会条件", "rule_key": "min_age", "rule_value": { "operator": ">=", "value": 18 }, "version": 1, "effective_at": "..." }] }`

### POST /constitution-rules
（staff）新增章程规则
- Body: `{ "rule_type": "入会条件", "rule_key": "min_age", "rule_value": { "operator": ">=", "value": 18 }, "description": "最低年龄要求" }`
- Response 201: `{ "id": "uuid", "version": 1 }`

### PATCH /constitution-rules/{id}
（staff）修改章程规则（自动递增版本号，旧版本标记 expired_at）
- Body: `{ "rule_value": { "operator": ">=", "value": 21 } }`
- Response 200: `{ "id": "uuid", "version": 2 }`

### DELETE /constitution-rules/{id}
（staff）停用章程规则（设置 expired_at）
- Response 200: `{ "id": "uuid", "expired_at": "..." }`
## Error Response Format

所有错误响应遵循统一格式：
```json
{
  "error": "error_code",
  "message": "Human-readable message (zh-CN)",
  "details": { ... }
}
```

HTTP Status Code:
- 400: 请求参数错误
- 401: 未认证
- 403: 权限不足
- 404: 资源不存在
- 409: 冲突（重复申请、重复报名等）
- 429: 请求频率超限
- 500: 服务器内部错误
